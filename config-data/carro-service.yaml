server:
  port: 8002 # Puerto del microservicio carro
eureka:
  instance:
    hostname: localhost # Direccion de host/IP de la instancia registrada
  client:
    fetch-registry: true # Consultar la lista de servicios de eureka (tambien true por defecto)
    register-with-eureka: true # Registrar este servicio en eureka (por defecto es true)
    service-url:
      default-zone: http://localhost:8761/eureka # URL del servidor eureka
      
  #eureka:
